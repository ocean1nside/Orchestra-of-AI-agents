# Пример для /etc/nginx/sites-available/agent-webhook
# HTTPS через certbot: certbot --nginx -d agent.YOUR_DOMAIN.example
server {
    listen 80;
    server_name agent.YOUR_DOMAIN.example;

    location /api/v1/telegram/webhook {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
        proxy_read_timeout 300s;
    }

    location /api/v1/max/webhook {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8010;
    }
}
