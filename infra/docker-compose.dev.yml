services:
  postgres:
    image: postgres:16
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  orchestrator-api:
    build:
      context: ../apps/orchestrator-api
    env_file:
      - path: ../.env
        required: true
      - path: ../apps/orchestrator-api/.env
        required: false
    environment:
      APP_ENV: development
    volumes:
      - ../storage:/storage
    depends_on:
      - postgres
      - redis
      - qdrant
    ports:
      - "8000:8000"

  vendor-support-agent:
    build:
      context: ../apps/agents/vendor-support-agent
    env_file:
      - path: ../.env
        required: true
      - path: ../apps/agents/vendor-support-agent/.env
        required: false
    environment:
      APP_ENV: development
    depends_on:
      - postgres
      - qdrant
    ports:
      - "8010:8010"

  indexing-worker:
    build:
      context: ../apps/orchestrator-api
    env_file:
      - path: ../.env
        required: true
      - path: ../apps/orchestrator-api/.env
        required: false
    environment:
      APP_ENV: development
    volumes:
      - ../storage:/storage
    depends_on:
      - redis
      - postgres
      - qdrant
    command: ["python", "-m", "orchestrator_api.worker"]

  socraticode:
    working_dir: /workspace
    image: node:20-alpine
    command: ["sh", "-lc", "sleep infinity"]
    volumes:
      - ../:/workspace
    profiles: ["devtools"]

volumes:
  postgres_data:
  qdrant_data:

