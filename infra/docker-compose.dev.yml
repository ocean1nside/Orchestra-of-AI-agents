services:
  postgres:
    image: postgres:16
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator}
    # Только localhost: иначе боты в интернете брутят postgres и меняют пароль.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  orchestrator-api:
    build:
      context: ../apps/orchestrator-api
    env_file:
      - path: ../.env
        required: true
      - path: ../apps/orchestrator-api/.env
        required: false
    environment:
      APP_ENV: development
    volumes:
      - ../storage:/storage
    depends_on:
      - postgres
      - redis
      - qdrant
    ports:
      - "127.0.0.1:8000:8000"

  vendor-support-agent:
    build:
      context: ../apps/agents/vendor-support-agent
    env_file:
      - path: ../.env
        required: true
      - path: ../apps/agents/vendor-support-agent/.env
        required: false
    environment:
      APP_ENV: development
    depends_on:
      - postgres
      - qdrant
    ports:
      - "127.0.0.1:8010:8010"

  indexing-worker:
    build:
      context: ../apps/orchestrator-api
    env_file:
      - path: ../.env
        required: true
      - path: ../apps/orchestrator-api/.env
        required: false
    environment:
      APP_ENV: development
    volumes:
      - ../storage:/storage
    depends_on:
      - redis
      - postgres
      - qdrant
    # Миграции выполняет orchestrator-api (общий ENTRYPOINT образа); worker только RQ.
    entrypoint: ["python", "-m", "orchestrator_api.worker"]

  socraticode:
    working_dir: /workspace
    image: node:20-alpine
    command: ["sh", "-lc", "sleep infinity"]
    volumes:
      - ../:/workspace
    profiles: ["devtools"]

  # Единый тестовый UI (Node-прокси → agent + orchestrator). Только dev, не prod.
  test-ui-studio:
    build:
      context: ../test_interfaces/agent_support_gleb
      dockerfile: Dockerfile.node-ui
      args:
        UI_SUBDIR: studio
    env_file:
      - path: ../.env
        required: true
      - path: ../apps/agents/vendor-support-agent/.env
        required: false
      - path: ../apps/orchestrator-api/.env
        required: false
    environment:
      AGENT_URL: http://vendor-support-agent:8010
      ORCHESTRATOR_URL: http://orchestrator-api:8000
      PORT: 8790
      STUDIO_BASE_PATH: /studio
    depends_on:
      - vendor-support-agent
      - orchestrator-api
    ports:
      - "127.0.0.1:8790:8790"
    profiles: ["devtools"]

volumes:
  postgres_data:
  qdrant_data:

