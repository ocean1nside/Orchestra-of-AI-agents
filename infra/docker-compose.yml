services:
  postgres:
    image: postgres:16
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

  qdrant:
    image: qdrant/qdrant:v1.11.3
    volumes:
      - qdrant_data:/qdrant/storage

  orchestrator-api:
    build:
      context: ../apps/orchestrator-api
    env_file:
      - ../.env
    volumes:
      - ../storage:/storage
    depends_on:
      - postgres
      - redis
      - qdrant

  indexing-worker:
    build:
      context: ../apps/orchestrator-api
    env_file:
      - ../.env
    volumes:
      - ../storage:/storage
    depends_on:
      - redis
      - postgres
      - qdrant
    command: ["python", "-m", "orchestrator_api.worker"]

  vendor-support-agent:
    build:
      context: ../apps/agents/vendor-support-agent
    env_file:
      - ../.env
    depends_on:
      - postgres
      - qdrant

volumes:
  postgres_data:
  qdrant_data:

