[project]
name = "orchestrator-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "SQLAlchemy>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "rq>=1.16",
  "redis>=5.0",
  "qdrant-client>=1.11,<1.12",
  "python-docx>=1.1",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uvicorn]
factory = true

[tool.ruff]
line-length = 100
target-version = "py312"

